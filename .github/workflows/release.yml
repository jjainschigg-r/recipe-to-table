name: Release

# Push a tag like v1.0.0 to publish a GitHub release with the Claude.ai skill zip attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python3 -m unittest discover -s tests
      - run: node tests/test_layout.mjs
      - name: Check the tag matches the plugin version
        run: |
          version="$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != plugin version $version"; exit 1; }
      - run: scripts/build-skill-zip.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/recipe-to-table.zip --title "$GITHUB_REF_NAME" --generate-notes
