name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Renderer validation tests
        run: python3 -m unittest discover -s tests -v
      - name: Table layout tests
        run: node tests/test_layout.mjs
      - name: Build skill zip
        run: scripts/build-skill-zip.sh
